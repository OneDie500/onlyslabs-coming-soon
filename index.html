<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="OnlySlabs — Something Big Is Coming.">
  <title>OnlySlabs | Coming Soon</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #000;
    }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow-x: hidden;
    }
    main {
      width: 100%;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #000;
    }
    img {
      display: block;
      width: min(100%, 1536px);
      height: auto;
      margin: auto;
    }
    @media (min-aspect-ratio: 3/2) {
      img {
        width: auto;
        max-width: 100%;
        height: 100vh;
        object-fit: contain;
      }
    }
  </style>
</head>
<body>
  <main>
    <img src="onlyslabs-coming-soon.png"
         alt="OnlySlabs — Something Big Is Coming. Cards. Community. Events. Built Different.">
  </main>
</body>
</html>
