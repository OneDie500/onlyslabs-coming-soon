<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="OnlySlabs — Cards. Community. Events. Built Different.">
  <title>OnlySlabs | Coming Soon</title>
  <style>
    :root{
      --bg:#000;
      --text:#f5f5f7;
      --muted:#a7a7ad;
      --line:#242429;
      --accent1:#7557ff;
      --accent2:#2e9cff;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}
    body{
      min-height:100vh;
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      display:flex;
      justify-content:center;
    }
    .page{
      width:min(1180px,100%);
      min-height:100vh;
      padding:32px 28px 34px;
      display:flex;
      flex-direction:column;
    }
    .top{
      display:flex;
      justify-content:flex-end;
      color:#8b8b91;
      font-size:12px;
      font-weight:700;
      letter-spacing:.12em;
      text-transform:uppercase;
    }
    main{
      flex:1;
      display:grid;
      place-items:center;
      text-align:center;
      padding:42px 0;
    }
    .hero{width:min(760px,100%)}
    .logo{
      width:min(510px,88vw);
      height:auto;
      display:block;
      margin:0 auto 18px;
    }
    .eyebrow{
      color:#a7a7ad;
      font-size:12px;
      font-weight:800;
      letter-spacing:.22em;
      text-transform:uppercase;
      margin-bottom:52px;
    }
    h1{
      margin:0;
      font-size:clamp(3rem,7vw,5.7rem);
      line-height:.94;
      letter-spacing:-.055em;
      font-weight:950;
      text-transform:uppercase;
    }
    .stroke{
      width:min(440px,72%);
      height:6px;
      margin:20px auto 58px;
      border-radius:999px;
      background:linear-gradient(90deg,var(--accent1),var(--accent2));
      box-shadow:0 0 24px rgba(82,100,255,.35);
      transform:skewX(-18deg);
    }
    .stay{
      margin:0 0 18px;
      color:#a7a7ad;
      font-size:12px;
      font-weight:800;
      letter-spacing:.2em;
      text-transform:uppercase;
    }
    .signup{
      width:min(610px,100%);
      margin:0 auto;
      display:flex;
      border:1px solid var(--line);
      border-radius:9px;
      overflow:hidden;
      background:#08080a;
    }
    .signup input{
      flex:1;
      min-width:0;
      border:0;
      outline:0;
      padding:17px 18px;
      color:var(--text);
      background:transparent;
      font:inherit;
    }
    .signup button{
      border:0;
      border-left:1px solid var(--line);
      padding:0 25px;
      color:#d8d8dd;
      background:#0d0d10;
      font-size:12px;
      font-weight:900;
      letter-spacing:.12em;
      cursor:pointer;
    }
    .note{
      min-height:20px;
      margin-top:10px;
      color:#85858c;
      font-size:12px;
    }
    .socials{
      margin-top:42px;
      display:flex;
      justify-content:center;
      gap:28px;
      flex-wrap:wrap;
    }
    .socials a{
      color:#929299;
      text-decoration:none;
      font-size:12px;
      font-weight:800;
      letter-spacing:.1em;
      text-transform:uppercase;
    }
    .socials a:hover{color:#fff}
    footer{
      border-top:1px solid #141417;
      padding-top:25px;
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:20px;
      color:#5f5f66;
      font-size:11px;
      letter-spacing:.08em;
      text-transform:uppercase;
    }
    footer strong{
      display:block;
      color:#b5b5bb;
      font-size:12px;
      letter-spacing:.18em;
      margin-bottom:5px;
    }
    @media(max-width:640px){
      .page{padding:22px 18px 26px}
      .top{justify-content:center}
      main{padding:34px 0}
      .eyebrow{margin-bottom:40px}
      .stroke{margin-bottom:46px}
      .signup{display:block;border-radius:8px}
      .signup button{width:100%;border-left:0;border-top:1px solid var(--line);padding:15px}
      footer{flex-direction:column;align-items:center;text-align:center}
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="top">Albuquerque, NM</div>

    <main>
      <section class="hero">
        <img class="logo" src="onlyslabs-logo.png" alt="OnlySlabs">
        <div class="eyebrow">Cards. Community. Events. Built Different.</div>

        <h1>Something Big<br>Is Coming.</h1>
        <div class="stroke"></div>

        <p class="stay">Stay in the loop</p>
        <form class="signup" id="signup">
          <input id="email" type="email" placeholder="Enter your email address" aria-label="Email address" required>
          <button type="submit">Join Us</button>
        </form>
        <div class="note" id="note">Preview signup for now — we'll connect this to your mailing list next.</div>

        <nav class="socials" aria-label="OnlySlabs social media">
          <!-- Replace # with the real OnlySlabs profile URLs -->
          <a href="#">Instagram</a>
          <a href="#">Facebook</a>
          <a href="#">TikTok</a>
          <a href="#">YouTube</a>
        </nav>
      </section>
    </main>

    <footer>
      <div><strong>Good Cards. Better People.</strong>OnlySlabs</div>
      <div>© 2026 OnlySlabs. All rights reserved.</div>
    </footer>
  </div>

  <script>
    document.getElementById('signup').addEventListener('submit', function(e){
      e.preventDefault();
      document.getElementById('note').textContent =
        "You're in — signup delivery will be connected before launch.";
      document.getElementById('email').value = "";
    });
  </script>
</body>
</html>
