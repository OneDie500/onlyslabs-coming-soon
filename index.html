<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="OnlySlabs — Something Big Is Coming.">
  <title>OnlySlabs | Coming Soon</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #000;
    }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow-x: hidden;
    }
    .wrap {
      width: 100%;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #000;
    }
    .art {
      display: block;
      width: 100%;
      height: auto;
      max-width: 1536px;
    }
    @media (min-aspect-ratio: 3/2) {
      .art {
        width: auto;
        height: 100vh;
        max-width: none;
      }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <img
      class="art"
      src="onlyslabs-coming-soon.png"
      alt="OnlySlabs — Something Big Is Coming. Cards. Community. Events. Built Different."
    >
  </main>
</body>
</html>
